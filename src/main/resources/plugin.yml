name: Metabasis
version: '${project.version}'
main: xyz.goga221.metabasis.MetabasisPlugin
api-version: '1.21'
folia-supported: true
author: goga221
description: Per-world spawns, warp points, and permission-gated warp groups.
depend: [CommandAPI]
softdepend: [LuckPerms]

permissions:
  metabasis.admin:
    description: Grants access to all Metabasis admin commands (warp set/delete/group-assign, group create/delete/permission/list, spawn set).
    default: op
